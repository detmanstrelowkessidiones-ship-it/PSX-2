name: Build XPS2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract XPS2 source
        run: |
          unzip -q XPS2_v0_5_build_ready.zip
          chmod +x xps2/build_android/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;25.2.9519653"
          sdkmanager "cmake;3.31.1"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > xps2/build_android/local.properties

      - name: Build XPS2 APK
        working-directory: xps2/build_android
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Upload XPS2 APK
        uses: actions/upload-artifact@v4
        with:
          name: XPS2-Android-ARMv7
          path: xps2/build_android/app/build/outputs/apk/release/*.apk
