name: Build XPS2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.31.1"

      - name: Extract XPS2 source
        run: |
          mkdir extracted
          unzip -q XPS2_v0_5_build_ready.zip -d extracted
          cp -a extracted/xps2/. .

      - name: Make Gradle executable
        run: chmod +x build_android/gradlew

      - name: Build APK
        working-directory: build_android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XPS2-armeabi-v7a-release
          path: build_android/build/outputs/apk/release/*.apk
